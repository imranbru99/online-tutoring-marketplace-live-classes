        <text x="33" y="22" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">SUN</text>
        <text x="33" y="44" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="15" font-weight="700">09</text>
