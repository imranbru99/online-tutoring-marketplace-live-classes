      <text x="45" y="52" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="800">1,940+</text>
      <line x1="90" y1="12" x2="90" y2="58" stroke="#334155" stroke-width="1" />
      <!-- Stat 2 -->
