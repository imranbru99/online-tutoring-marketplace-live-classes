      <text x="75" y="50" fill="#94A3B8" font-family="sans-serif" font-size="11">Guardian: Michael Miller (Parent Verified)</text>
      <text x="75" y="70" fill="#34D399" font-family="sans-serif" font-size="11">● Currently in Live Math Class with Dr. Rostova (38 mins elapsed)</text>
