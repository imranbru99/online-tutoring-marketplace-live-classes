      <rect width="160" height="75" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10.5" font-weight="700">ATTENDANCE RATE</text>
      <text x="14" y="52" fill="#34D399" font-family="sans-serif" font-size="22" font-weight="800">98.4%</text>
      <text x="14" y="66" fill="#64748B" font-family="sans-serif" font-size="10">24 of 25 classes</text>

      <!-- Stat 2 -->
      <g transform="translate(180, 0)">
        <rect width="160" height="75" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10.5" font-weight="700">HOMEWORK SCORE</text>
        <text x="14" y="52" fill="#60A5FA" font-family="sans-serif" font-size="22" font-weight="800">A+ (94%)</text>
        <text x="14" y="66" fill="#64748B" font-family="sans-serif" font-size="10">12 assignments</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(360, 0)">
        <rect width="160" height="75" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10.5" font-weight="700">PREPAID CREDITS</text>
        <text x="14" y="52" fill="#FBBF24" font-family="sans-serif" font-size="22" font-weight="800">6 Lessons</text>
        <text x="14" y="66" fill="#64748B" font-family="sans-serif" font-size="10">$180.00 balance</text>
      </g>
    </g>

    <!-- Parent Action Center -->
    <g transform="translate(20, 275)">
      <text x="0" y="15" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="700">🛡️ Safety &amp; Approval Permissions</text>
      
      <!-- Permission 1 -->
      <g transform="translate(0, 30)">
        <rect width="520" height="52" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <text x="16" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Booking Authorization Gate</text>
        <text x="16" y="38" fill="#94A3B8" font-family="sans-serif" font-size="11">Requires guardian 1-click confirmation before child commits funds</text>
        <rect x="450" y="14" width="55" height="24" rx="12" fill="#10B981" />
        <circle cx="488" cy="26" r="9" fill="#FFFFFF" />
      </g>

      <!-- Permission 2 -->
      <g transform="translate(0, 92)">
        <rect width="520" height="52" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <text x="16" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Session Video Recording Access</text>
        <text x="16" y="38" fill="#94A3B8" font-family="sans-serif" font-size="11">Watch full classroom replays and view tutor annotations</text>
        <rect x="450" y="14" width="55" height="24" rx="12" fill="#10B981" />
        <circle cx="488" cy="26" r="9" fill="#FFFFFF" />
      </g>

      <!-- Permission 3 -->
      <g transform="translate(0, 154)">
        <rect width="520" height="52" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <text x="16" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Instant Teacher Direct Messaging</text>
        <text x="16" y="38" fill="#94A3B8" font-family="sans-serif" font-size="11">Chat with Dr. Elena Rostova regarding progress report</text>
        <rect x="420" y="14" width="85" height="24" rx="6" fill="#4F46E5" />
        <text x="462" y="30" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Open Chat</text>
      </g>
    </g>

    <!-- Guardian Mobile Banner -->
    <g transform="translate(20, 505)">
      <rect width="520" height="42" rx="6" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" fill="#38BDF8" font-family="sans-serif" font-size="11.5" font-weight="600">📱 Mobile PWA Ready — Parents can install directly on iOS &amp; Android without App Store</text>
