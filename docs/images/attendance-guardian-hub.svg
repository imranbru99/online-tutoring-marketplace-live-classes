      <text x="25" y="92" fill="#93C5FD" font-family="sans-serif" font-size="11">1. Automatically dispatches encrypted WebRTC live classroom stream link to Guardian via WhatsApp/SMS</text>
      <text x="25" y="112" fill="#93C5FD" font-family="sans-serif" font-size="11">2. Student attends virtually without missing a single lesson</text>
      <text x="25" y="132" fill="#34D399" font-family="sans-serif" font-size="11">✓ Zero learning disruption • 100% attendance accountability</text>
    </g>
  </g>

