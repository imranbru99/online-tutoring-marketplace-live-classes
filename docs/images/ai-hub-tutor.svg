      <text x="56" y="20" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">Student (Sarah M.): <tspan font-weight="400">Can you explain how to solve the integral ∫ x · e^(2x) dx using integration by parts?</tspan></text>
      <text x="56" y="36" fill="#64748B" font-family="sans-serif" font-size="10">2:14 PM · Mobile PWA App</text>
    </g>

    <!-- Chat Message: AI Tutor Socratic Step-by-Step Response -->
    <g transform="translate(25, 142)">
      <circle cx="16" cy="16" r="16" fill="url(#purpleGrad)" />
      <text x="16" y="21" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">AI</text>
      <rect x="42" y="0" width="670" height="155" rx="8" fill="#090D16" stroke="#4C1D95" stroke-width="1.2" />
      <text x="56" y="22" fill="#A78BFA" font-family="sans-serif" font-size="12" font-weight="700">EduFlow AI Tutor (Socratic Mode):</text>
      <text x="56" y="42" fill="#CBD5E1" font-family="sans-serif" font-size="12">Let's use LIATE rule to assign <tspan fill="#38BDF8" font-weight="700">u</tspan> and <tspan fill="#F472B6" font-weight="700">dv</tspan>:</text>
      <text x="70" y="64" fill="#38BDF8" font-family="'Courier New', monospace" font-size="12" font-weight="700">1. Let u = x   ==>  du = dx</text>
      <text x="70" y="82" fill="#F472B6" font-family="'Courier New', monospace" font-size="12" font-weight="700">2. Let dv = e^(2x) dx   ==>  v = (1/2) e^(2x)</text>
      <text x="56" y="104" fill="#CBD5E1" font-family="sans-serif" font-size="12">Applying formula <tspan fill="#FBBF24" font-weight="700">∫ u dv = u·v - ∫ v du</tspan>:</text>
      <text x="70" y="124" fill="#34D399" font-family="'Courier New', monospace" font-size="13" font-weight="700">∫ x·e^(2x) dx = (1/2) x·e^(2x) - (1/4) e^(2x) + C = (1/4) e^(2x) (2x - 1) + C</text>
      <rect x="56" y="132" width="130" height="18" rx="4" fill="#065F46" />
      <text x="121" y="144" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="700">✓ Step Verified by DeepSeek</text>
    </g>
  </g>

