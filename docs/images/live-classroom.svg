      <rect x="14" y="8" width="94" height="20" rx="4" fill="#6366F1" />
      <text x="61" y="22" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="600">Sarah (Student)</text>
    </g>

